<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body bgcolor="orange" text="yellow">
<h1>change background and text color</h1>
<input type="button" value="submit" onclick="back10()">
<script>
function back10()
{
    const bg = prompt("enter background color");
    const fg = prompt("enter text color");
    document.bgColor=bg;
    document.fgColor=fg;
}




</script>    
    
</body>
</html>
