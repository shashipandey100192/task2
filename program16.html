<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *
        {
            margin:0 auto;
            padding:0;
        }
        section
        {
            width:1200px;
            height: 300px;
            background-color: antiquewhite;
            margin-top:10px;
            padding:20px;
            box-sizing: border-box;

        }
        #box
        {
            background-color: orange;
            width: 500px;
            text-align: center;
            border-radius: 20px;
            margin-left: -100%;
            transition-duration:300ms;
        }
    </style>
</head>
<body onscroll="mysize()">


 <section>box1</section>
 <section>box2</section>
 <section>box3</section>
 <section>box4</section>
 <section>box5</section>
 <section>box6</section>
 <section>box7</section>
 <section id="box">box8</section>
 <section>box9</section>
 <section>box10</section>
 <section>box11</section>
 <section>box12</section>
 <section>box13</section>
 <section>box14</section>
 <section>box15</section>
 <section>box16</section>
 <section>box17</section>
 <section>box18</section>
 <section>box19</section>
 <section>box20</section>   
    

 <script>
    function mysize()
    {
        var a = window.scrollY;
        console.log(a);
       var mybox = document.getElementById('box');

        if(a>=2000)
    {
        mybox.style.marginLeft="0%";
        mybox.style.transitionDuration="300ms";

    }
    else
    {
        mybox.style.marginLeft="-100%";
    }
    }
 </script>
</body>
</html>
