<!DOCTYPE html>

    <title>Document</title>
    <style>
        .first
        {
            color:red;
            background-color: green;
            font-size: 20px;
            box-shadow: 2px 2px 5px black;

        }
        .second
        {
            border:none;
        }
        .third
        {
            border-radius: 50px;
        }
        
    </style>
</head>

<body>

    <input type="password">
    <input type="button" value="show">


    <script>
        var a = document.querySelectorAll("input");
        var x = 1;
        a[1].addEventListener("click", () => {
            if (x == 1) {
                a[0].setAttribute("type", "text");
                a[1].setAttribute("value", "hide");
                x++;
            }
            else {
                a[0].setAttribute("type", "password");
                a[1].setAttribute("value", "show");
                x = 1;
            }
        });
