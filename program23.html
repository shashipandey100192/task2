<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #one
        {
            width:50px;
            height: 50px;
            background-color: red;
            border-radius: 50%;
            text-align: center;
            line-height: 50px;
            color:white;
        }
    </style>
</head>
<body>

    <input type="button" value="submit" onclick="abc()">
    <div id="one"></div>
<script>
    var b;
     var btn  = document.getElementById('one');
    function abc()
    {
     var a = (Math.random()*6)+1;
      b = Math.floor(a);
        console.log(b);
        btn.innerHTML=b;
    }
    abc();
  
        
        btn.addEventListener("click",()=>{
          console.log(btn);
            btn.style.marginLeft=`${b+50}px`;
        })
    




</script>

    
</body>
</html>
